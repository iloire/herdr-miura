name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Ubuntu: macOS arm64 runners sat queued until GitHub gave up on the job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # rustup reads src-tauri/rust-toolchain.toml and installs the pinned toolchain.
      - name: Rust toolchain
        working-directory: src-tauri
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Rust tests and lint
        working-directory: src-tauri
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        run: npm run tauri build -- --no-bundle
