[package]
name = "herdr-tauri"
version = "0.1.0"
description = "Herdr UI in TypeScript on Tauri"
authors = ["ivan l."]
edition = "2024"
rust-version = "1.96"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "herdr_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The daemon's wire format and command catalog come from herdr-gpui rather than
# a TypeScript port: bincode field order is a compatibility contract that
# herdr-gpui already tracks and tests. Pinned; bump `rev` to follow upstream.
herdr-client = { git = "https://github.com/penso/herdr-gpui", rev = "4987e2497712c48b88bb4dbe0b3fbfede6e9ddd9" }
base64 = "0.22"
herdr-commands = { git = "https://github.com/penso/herdr-gpui", rev = "4987e2497712c48b88bb4dbe0b3fbfede6e9ddd9" }
herdr-vcs = { git = "https://github.com/penso/herdr-gpui", rev = "4987e2497712c48b88bb4dbe0b3fbfede6e9ddd9" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
