[package]
name = "herdr-tauri"
version = "0.1.0"
description = "Herdr UI in TypeScript on Tauri"
authors = ["ivan l."]
edition = "2024"
rust-version = "1.96"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "herdr_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The daemon's wire types are copied from Herdr itself (src/herdr/NOTICE.md)
# and encoded with bincode 2 through serde, as Herdr frames them.
bincode = { version = "2", features = ["serde"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
thiserror = "2"
# Writes one settings key at a time, keeping the file's comments and layout.
toml_edit = "0.25"
# Claude plan usage from Anthropic's OAuth usage endpoint.
ureq = "3"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
